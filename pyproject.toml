[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g4brainatlasdose"
version = "0.1.0"
description = "Geant4-based Monte Carlo brain dosimetry on MRI-derived phantoms with atlas-based reporting."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "nibabel>=5.2",
    "pyyaml>=6",
]

[project.scripts]
g4brainatlasdose-mvp = "g4brainatlasdose.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
]
viz = [
    "matplotlib",
]
geant4-prep = [
    "simpleitk",
    "scipy",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
